name: Bug report
description: Something did not work as the docs say
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Multipane version and Windows version
      placeholder: "v0.1.0 · Windows 11 24H2 · 150% scaling"
    validations:
      required: true
  - type: dropdown
    id: claude
    attributes:
      label: Claude Desktop build
      options: [Microsoft Store, Installer, Not sure]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you saw. The log is in %LOCALAPPDATA%\Multipane\logs (it contains no chat titles or personal paths); attach the relevant lines.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed account names, emails and anything personal from the report.
          required: true
