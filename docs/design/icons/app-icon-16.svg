<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" role="img" aria-label="Multipane app icon, small">
  <!-- Pixel-aligned variant for 16 and 20 px: 1 px gaps, no inner radius, so the four panes stay readable. -->
  <rect width="16" height="16" rx="3.5" fill="#2E3A4A"/>
  <rect x="3" y="3" width="4.5" height="4.5" rx="1" fill="#3FB8B8"/>
  <rect x="8.5" y="3" width="4.5" height="4.5" rx="1" fill="#E9E4DA"/>
  <rect x="3" y="8.5" width="4.5" height="4.5" rx="1" fill="#E9E4DA"/>
  <rect x="8.5" y="8.5" width="4.5" height="4.5" rx="1" fill="#E9E4DA"/>
</svg>
